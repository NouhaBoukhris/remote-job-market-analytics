name: Generate dashboard preview
on:
  push:
    branches: [main]
    paths:
      - 'powerbi/Scraper Power BI Dashboard.pdf'
      - '.github/workflows/dashboard-preview.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render first PDF page
        run: |
          python -m pip install --disable-pip-version-check pymupdf
          mkdir -p images
          python - <<'PY'
          import fitz
          doc = fitz.open("powerbi/Scraper Power BI Dashboard.pdf")
          pix = doc[0].get_pixmap(matrix=fitz.Matrix(2, 2), alpha=False)
          pix.save("images/remote_job_dashboard.png")
          PY
      - name: Commit preview image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/remote_job_dashboard.png
          if ! git diff --cached --quiet; then
            git commit -m "Add Power BI dashboard preview image"
            git push
          fi
